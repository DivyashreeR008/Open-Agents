version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "DivyashreeR008"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
    # Major updates remain visible, but are grouped so their compatibility
    # review can be planned as one deliberate change.
    groups:
      major-dependencies:
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "DivyashreeR008"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
