name: Auto Label New Issues

# Trigger: fires whenever a new issue is opened
on:
  issues:
    types: [opened]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Label based on title prefix
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = (context.payload.issue.title || '').trim();
            const labels = new Set();

            if (title.startsWith('[Bug]')) labels.add('bug');
            if (title.startsWith('[Feature]')) labels.add('enhancement');
            if (title.startsWith('[Agent]')) labels.add('new-agent');
            if (title.startsWith('[Feedback]')) labels.add('feedback');
            if (title.startsWith('[Agent Proposal]')) labels.add('new-agent');

            // Fallback: only issues with no recognised type prefix need initial review
            if (labels.size === 0) labels.add('triage');

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: [...labels],
            });
