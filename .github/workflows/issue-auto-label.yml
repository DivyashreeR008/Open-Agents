name: Auto Label New Issues

# Trigger: fires whenever a new issue is opened
on:
  issues:
    types: [opened]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Label based on form answer and title prefix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = (context.payload.issue.title || '').trim();
            const body = context.payload.issue.body || '';

            // ---- 1. Type label, from the template's title prefix ----
            let type = null;
            if (title.startsWith('[Bug]')) type = 'bug';
            if (title.startsWith('[Feature]')) type = 'enhancement';
            if (title.startsWith('[Agent]')) type = 'new-agent';
            if (title.startsWith('[Agent Proposal]')) type = 'new-agent';
            if (title.startsWith('[Feedback]')) type = 'feedback';

            // ---- 2. Difficulty, from the required "Difficulty" dropdown ----
            // GitHub renders a dropdown answer as:  ### Difficulty\n\n<answer>
            const m = body.match(/^###\s*Difficulty\s*\r?\n+\s*([^\r\n]+)/im);
            const answer = m ? m[1].trim().toLowerCase() : '';
            let difficulty = null;
            if (answer.startsWith('easy')) difficulty = 'easy';
            else if (answer.startsWith('medium')) difficulty = 'medium';
            else if (answer.startsWith('hard')) difficulty = 'hard';

            const labels = new Set();

            // Every issue belongs to the current NSoC season.
            // `nsoc26` is the exact label the NSoC leaderboard scores on;
            // `nsoc-2026` is kept for the repo's own history/filters.
            labels.add('nsoc-2026');
            labels.add('nsoc26');

            if (type) labels.add(type);

            if (difficulty) {
              labels.add(`difficulty: ${difficulty}`);
              // Repo convention: good first issue <=> difficulty: easy
              if (difficulty === 'easy') labels.add('good first issue');
            }

            // The NSoC leaderboard scores an item on `nsoc26` + a level label
            // (level1 +3, level2 +5, level3 +10). An item without a level
            // scores 0, so every issue gets one before it can be counted.
            labels.add('level3');

            // Fallback: no recognised type and no usable difficulty needs a human.
            if (!type && !difficulty) labels.add('triage');

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: [...labels],
            });
