name: Auto Label New Pull Requests

# The NSoC leaderboard penalises every merged PR that carries no `nsoc26`
# label (-5 each). This workflow makes sure no PR can land unlabelled and
# mirrors the linked issue's difficulty onto the PR's level label.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Add the NSoC season and level labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pull = context.payload.pull_request || {};
            const labels = ['nsoc26'];
            const labelName = (label) =>
              typeof label === 'string' ? label : label?.name || '';

            // Mirror the conventional-commit type into a GitHub label so the
            // board can tell features from fixes.
            const title = (pull.title || '').trim();
            if (/^feat(\(|!|:)/i.test(title)) labels.push('enhancement');
            else if (/^fix(\(|!|:)/i.test(title)) labels.push('bug');
            else if (/^docs?(\s|\(|:)/i.test(title)) labels.push('documentation');

            // Automated dependency PRs are not participant work.
            if (pull.user?.login === 'dependabot[bot]') {
              labels.push('automated', 'dependencies');
            }

            // The NSoC leaderboard scores a merged PR on its level label
            // (level1 +3, level2 +5, level3 +10). A PR that carries `nsoc26`
            // but no level scores 0, so every PR gets one before it can merge.
            const existing = new Set((pull.labels || []).map(labelName).filter(Boolean));
            const hasLevel = [...existing].some((label) => /^level[123]$/i.test(label));

            if (!hasLevel) {
              const levelForDifficulty = {
                'difficulty: easy': 'level1',
                'difficulty: medium': 'level2',
                'difficulty: hard': 'level3',
              };
              const rank = { level1: 1, level2: 2, level3: 3 };
              const linkedIssues = [
                ...new Set(
                  [...String(pull.body || '').matchAll(
                    /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)\b/gi
                  )].map((match) => Number(match[1]))
                ),
              ];

              let derivedLevel = null;
              for (const issue_number of linkedIssues) {
                try {
                  const { data: issue } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number,
                  });
                  const level = (issue.labels || [])
                    .map((label) => levelForDifficulty[labelName(label).toLowerCase()])
                    .find(Boolean);
                  if (level && (!derivedLevel || rank[level] > rank[derivedLevel])) {
                    derivedLevel = level;
                  }
                } catch (error) {
                  console.log(
                    `Could not read linked issue #${issue_number}: ${error.message || error}`
                  );
                }
              }

              // Keep level3 as the documented fallback when no linked issue has
              // a recognised difficulty label.
              labels.push(derivedLevel || 'level3');
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull.number,
              labels: [...new Set(labels)],
            });
