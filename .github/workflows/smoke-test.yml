name: Smoke Test (Built Output)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deny everything by default; the job below opts in to repository reads and
# pull-request comments for the failure notice.
permissions: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke test against built output
        run: npm run test:smoke

      - name: Comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Built-output smoke test failed on this PR.**\n\nThe build was served and exercised, but a smoke check failed.\n\n1. Run \`npm run test:smoke\` locally to reproduce\n2. Fix any build/import/asset errors shown\n3. Push your fix — the check will re-run automatically\n\nThis test needs no provider keys. See scripts/smoke-test.mjs. 🙏`
            })
