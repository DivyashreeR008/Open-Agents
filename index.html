<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Resolve the saved or system theme before the first paint. -->
    <script src="/theme-init.js"></script>
    <!--
      Icon links carry a version query on purpose. Browsers cache favicons
      per-origin and aggressively, so a stale icon can outlive a deploy by
      days. Bumping ICON_VERSION forces a fresh fetch for every visitor.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Open Agents — Run AI agents directly in your browser. Open source, community-built. Bring your own API key."
    />
    <title>Open Agents</title>
    <style>
      .boot-shell {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 0.5rem;
        padding: 2rem;
        text-align: center;
        color: #18181b;
        background: #ffffff;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .boot-shell h1 {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }
      .boot-shell p {
        margin: 0;
        color: #52525b;
        font-size: 0.875rem;
      }
      @media (prefers-color-scheme: dark) {
        .boot-shell {
          color: #fafafa;
          background: #09090b;
        }
        .boot-shell p {
          color: #a1a1aa;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <h1>Open Agents</h1>
        <p role="status">Loading the agent workspace...</p>
      </div>
    </div>
    <noscript>Open Agents needs JavaScript enabled to run agents in your browser.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
