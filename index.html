<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Resolve the saved or system theme before the first paint. -->
    <script src="/theme-init.js"></script>
    <!--
      Icon links carry a version query on purpose. Browsers cache favicons
      per-origin and aggressively, so a stale icon can outlive a deploy by
      days. Bumping ICON_VERSION forces a fresh fetch for every visitor.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Open Agents — Run AI agents directly in your browser. Open source, community-built. Bring your own API key."
    />
    <title>Open Agents</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
